{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="feature-icon mb-3"><i class="bi bi-box-arrow-in-right"></i></div>
                        <h1 class="h3 mb-1">Đăng nhập</h1>
                        <p class="text-muted mb-0">Tiếp tục hành trình nghề nghiệp của bạn.</p>
                    </div>

                    <form method="post" novalidate>
                        {% csrf_token %}
                        {{ form|crispy }}
                        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                    </form>

                    <hr class="my-4">

                    <p class="text-muted text-center mb-0">
                        Chưa có tài khoản? <a href="{% url 'users:signup' %}">Đăng ký ngay</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
