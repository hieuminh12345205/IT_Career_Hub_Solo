{% extends "base.html" %}

{% block title %}Không tìm thấy trang{% endblock %}

{% block content %}

        <div class="error-code">404</div>
        <h1 class="h3 mb-2">Không tìm thấy nội dung</h1>
        <p class="text-muted mb-4">
            Trang hoặc tin tuyển dụng bạn tìm có thể đã bị xóa, đã đóng hoặc chưa từng tồn tại.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a href="{% url 'core:home' %}" class="btn btn-primary">Về trang chủ</a>
            <a href="{% url 'jobs:list' %}" class="btn btn-outline-primary">Xem việc làm</a>
        </div>
    </div>
</div>
{% endblock %}
